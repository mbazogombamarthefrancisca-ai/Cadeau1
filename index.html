<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitation Anniversaire - Soirée Exclusive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <div class="glow-overlay"></div>
        <div class="border-outer">
            <div class="border-inner">
                
                <div class="corner corner-tl"></div>
                <div class="corner corner-tr"></div>
                <div class="corner corner-bl"></div>
                <div class="corner corner-br"></div>

                <!-- En-tête -->
                <h1>
                    À l'occasion<br>
                    <span>de ma</span><br>
                    nouvelle ride
                </h1>

                <p class="subtitle-intro">j'ai le plaisir de t'inviter à ma </p>
                <div class="event-title">Soirée Exclusive</div>

                <div class="divider-line"></div>
                <div class="laurel-icon"></div>

                <!-- Informations -->
                <div class="details-section">
                    <p class="light-text"><span class="label">Dress code :</span> Blanc ou Belge</p>
                    <p class="light-text"><span class="label">Mercredi 07 Octobre • 17h à l'aube</span></p>
                    <p class="dark-text" style="margin-top: 12px;"><span class="label">Lieu :</span> Descente de Jeanne Ebori</p>

                    <div class="price-group dark-text">
                        <p><span class="label">Participation festive:</span></p>
                        <p>15.000F / personne</p>
                        <p>28.000F / couple</p>
                    </div>
                </div>

                <!-- Formulaire de confirmation via WhatsApp -->
                <div class="confirm-section">
                    <input type="text" id="nom" placeholder="Entrez ton nom ici..." class="input-nom">
                    <button id="btn" class="btn-confirm">Confirmer ma présence</button>
                </div>

                <div class="footer-note">
                    Soirée privée — Sur invitation uniquement
                </div>

            </div>
        </div>
    </div>

    <!-- Liaison JavaScript -->
    <script src="script.js"></script>
</body>
</html>
